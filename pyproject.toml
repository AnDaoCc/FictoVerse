[project]
name = "fictoverse"
version = "2026.2.0"
description = "FictoVerse - 本地虚构宇宙模拟器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "Pillow>=10.0",
  "uvicorn>=0.30",
  "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11.0", "pytest-cov>=6.0"]
launcher = ["pywebview>=5.2"]

[project.scripts]
fictoverse-gui = "novel_world.launcher.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle errors and warnings
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "B",           # flake8-bugbear
  "UP",          # pyupgrade
  "SIM",         # flake8-simplify
  "C4",          # flake8-comprehensions
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--cov=novel_world --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
